openapi: 3.0.3
info:
  title: SmartHal UI Backend API
  version: 1.0.0
  description: |
    OpenAPI specification for the SmartHal UI Backend.
  contact:
    name: CreativeCoders
  license:
    name: Apache 2.0
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/info:
    get:
      tags:
        - Info
      summary: Returns general application information
      operationId: getInfo
      responses:
        '200':
          description: Application information successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfo'
  /api/device-groups:
    post:
      tags:
        - DeviceGroups
      operationId: createDeviceGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupCreationRequest'
        required: true
      responses:
        '201':
          description: Device group successfully created
          content:
            application/json:
              schema:
                type: string
                format: uuid
                description: ID of the newly created device group
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid username or password
components:
  schemas:
    AppInfo:
      type: object
      description: Data structure returned by `InfoController.info()`
      properties:
        version:
          type: string
          description: Application version
      required:
        - version
    DeviceGroupCreationRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the new device group
      required:
        - name
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: Password
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
      required:
        - token
