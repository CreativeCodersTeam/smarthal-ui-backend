openapi: 3.0.3
info:
  title: SmartHal UI Backend API
  version: 1.0.0
  description: |
    OpenAPI specification for the SmartHal UI Backend.
  contact:
    name: CreativeCoders
  license:
    name: Apache 2.0
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/v1/info:
    get:
      tags:
        - Info
      summary: Returns general application information
      operationId: getInfo
      responses:
        '200':
          description: Application information successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfoV1'
  /api/v1/device-groups:
    post:
      tags:
        - DeviceGroups
      operationId: createDeviceGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupCreationRequestV1'
        required: true
      responses:
        '201':
          description: Device group successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceGroupCreationResponseV1'
    get:
      tags:
        - DeviceGroups
      operationId: getDeviceGroups
      responses:
        '200':
          description: Device groups successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceGroupV1'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestV1'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseV1'
        '401':
          description: Invalid username or password
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestV1'
      responses:
        '200':
          description: Logout successful
        '401':
          description: Invalid token
components:
  schemas:
    AppInfoV1:
      type: object
      description: Data structure returned by `InfoController.info()`
      properties:
        version:
          type: string
          description: Application version
      required:
        - version
    DeviceGroupV1:
      type: object
      description: Data structure returned by `DeviceGroupsController.getDeviceGroups()`
      properties:
        id:
          type: string
          description: Unique identifier of the device group
          format: uuid
        name:
          type: string
          description: Name of the device group
        createdAt:
          type: string
          description: Date and time when the device group was created
          format: date-time
    DeviceGroupCreationRequestV1:
      type: object
      properties:
        name:
          type: string
          description: Name of the new device group
      required:
        - name
    DeviceGroupCreationResponseV1:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the created device group
          format: uuid
      required:
        - id
    LoginRequestV1:
      type: object
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: Password
      required:
        - username
        - password
    LoginResponseV1:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
      required:
        - token
    LogoutRequestV1:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token to be invalidated
      required:
        - token
