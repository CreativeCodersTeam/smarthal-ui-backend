spring.application.name=smarthal-ui-backend
#logging.level.org.springframework.security=DEBUG
# === H2 + JPA configuration ===
# Configurable base directory for H2 database files
smarthal.db.h2-path=./target/h2db
# DataSource
spring.datasource.url=jdbc:h2:file:${smarthal.db.h2-path}/smarthal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# H2 console (useful for local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

